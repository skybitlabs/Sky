<!DOCTYPE html>

<body>
  <!-- Navigation -->

                  <a href="index.html" class="nav-link">Home</a>

              <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
                  <span class="hamburger-line"></span>
                  <span class="hamburger-line"></span>
                  <span class="hamburger-line"></span>
              </button>
          </nav>
      </div>

      <div class="mobile-menu" id="mobileMenu">
          <div class="mobile-menu-content">
              <a href="index.html" class="mobile-nav-link">Home</a>
              <a href="about.html" class="mobile-nav-link">About</a>
              
              <a href="contact.html" class="mobile-nav-link">Contact</a>
              <button class="btn btn-primary mobile-btn">Get Started</button>
          </div>
      </div>
  </header>

  <main>
      <div class="container page-container">
          <section class="page-header">
              <h1 class="page-title">Get in Touch</h1>
              <p class="page-subtitle">
                  Ready to elevate your web presence? We're here to help transform your vision into reality.
              </p>
          </section>

          <section class="contact-form-section">
              <div class="contact-form-grid">
                  <div class="contact-info">
                      <h2>Contact Information</h2>
                      
                      <div class="contact-item">
                          <div class="contact-item-icon">✉️</div>
                          <div>
                              <h3>Email</h3>
                              <p>hello@skybyte.design</p>
                          </div>
                      </div>
                      
                      
                      <div class="social-section">
    <h3>Connect With Us</h3>
    <div class="social-links">
        <a href="https://www.linkedin.com/in/sky-byte-4210722b8/" class="social-link" aria-label="LinkedIn" target="_blank" rel="noopener">
            <i class="fab fa-linkedin-in"></i>
        </a>
        <a href="https://www.instagram.com/sky_byte_/profilecard/" class="social-link" aria-label="Instagram" target="_blank" rel="noopener">
            <i class="fab fa-instagram"></i>
        </a>
        <a href="skybyte85@gmail.com" class="social-link" aria-label="Twitter" target="_blank" rel="noopener">
            <i class="fas fa-envelope"></i>
        </a>
    </div>
</div>

                  </div>
                  
                  <div class="contact-form">
                      <h2>Send a Message</h2>
                      <form id="contactForm">
                          <div class="form-row">
                              <div class="form-group">
                                  <label for="name">Name</label>
                                  <input type="text" id="name" name="name" required>
                              </div>
                              <div class="form-group">
                                  <label for="email">Email</label>
                                  <input type="email" id="email" name="email" required>
                              </div>
                          </div>
                          
                          <div class="form-group">
                              <label for="subject">Subject</label>
                              <input type="text" id="subject" name="subject" required>
                          </div>

                         <div class="form-group">
                             <label for="mobile">Mobile Number</label>
                             <input type="tel" id="mobile" name="mobile" required 
                              pattern="[0-9]{10}" maxlength="10" placeholder="Enter 10-digit number">
                          </div>

                          
                          
                          <div class="form-group">
                              <label for="message">Message</label>
                              <textarea id="message" name="message" required></textarea>
                          </div>
                          
                          <button type="submit" class="btn btn-primary btn-large">Send Message</button>
                      </form>
                  </div>
              </div>
          </section>
      </div>
  </main>

  <script src="js/script.js"></script>


  <script>
document.getElementById('contactForm').addEventListener('submit', function (e) {
    e.preventDefault(); // prevent actual form submission

    const webhookURL = 'https://discord.com/api/webhooks/1405559755421782026/SpjZsEH8ESIIvrzvbNZ-w5oZrRVLuCbk7_i2cD0x-6hKzUovXuP3FNArW3McyoBhcP9d'; // replace with your webhook URL

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const mobile = document.getElementById('mobile').value.trim();
    const message = document.getElementById('message').value.trim();

    const content = `**New Contact Form Submission** 📬
**Name:** ${name}
**Email:** ${email}
**Subject:** ${subject}
**Mobile:** ${mobile}
**Message:** ${message}`;

    fetch(webhookURL, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            content: content
        }),
    })
    .then(response => {
        if (response.ok) {
            alert('Message sent to Discord!');
            document.getElementById('contactForm').reset();
        } else {
            alert('Failed to send message.');
        }
    })
    .catch(error => {
        alert('Error sending message.');
        console.error(error);
    });
});
</script>

</body>
</html>
